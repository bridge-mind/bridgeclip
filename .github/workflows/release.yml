name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

# BridgeClip ships through GitHub Releases only; electron-updater reads
# latest-mac.yml from the published release (see electron-builder.yml).
permissions:
  contents: read

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Validate release tag before checkout
        id: validate
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
      - name: Fetch only an explicit release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.validate.outputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - name: Freeze the tag commit without executing repository code
        id: resolve
        env:
          TAG_NAME: ${{ steps.validate.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          release_sha="$(git rev-parse --verify "refs/tags/$TAG_NAME^{commit}")"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" = "$release_sha" ]] || exit 1
          if [[ "$EVENT_NAME" = push ]]; then
            [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$release_sha" = "$(git rev-parse --verify "$EVENT_SHA^{commit}")" ]] || exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: resolve-release
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            electron_arch: arm64
            runner: macos-15
          - arch: x64
            electron_arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Verify runner architecture
        run: |
          host_arch="$(uname -m)"
          if [[ "${{ matrix.arch }}" = "arm64" ]]; then
            [[ "$host_arch" = "arm64" ]] || exit 1
          else
            [[ "$host_arch" = "x86_64" ]] || exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Setup Python for dependency audit
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Validate release version
        env:
          TAG_NAME: ${{ needs.resolve-release.outputs.tag }}
        run: |
          VERSION=$(jq -r .version package.json)
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$VERSION tag=$TAG_NAME"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg caption build dependencies
        run: brew install pkgconf libass

      - name: Audit exact staged BridgeClip engine dependencies and scan sources
        run: |
          brew install gitleaks
          python3 -m pip install pip-audit==2.10.1
          python3 -m pip_audit --requirement engine/requirements.lock --disable-pip --require-hashes
          python3 -m pip install --require-hashes -r engine/requirements.lock
          gitleaks git --no-banner --redact=100 --log-opts=--all
          gitleaks dir --no-banner --redact=100 engine
          gitleaks dir --no-banner --redact=100 bridge

      - name: Validate application
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm audit --audit-level=low

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          trap 'rm -f certificate.p12' EXIT
          keychain_password="$(openssl rand -hex 32)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" build.keychain
          security set-keychain-settings build.keychain

      - name: Bundle standalone Python 3.12 with BridgeClip engine dependencies
        env:
          PBS_TAG: "20260901"
          PBS_VERSION: "3.12.14"
        run: |
          # Download relocatable Python from python-build-standalone.
          # These builds are fully self-contained — no framework dependencies.
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            PBS_ARCH="aarch64"
            PBS_SHA256="81a359f1cfadd4da11766534c5913791cea55f26e1bb902cacd2a531bb1e4b2b"
          else
            PBS_ARCH="x86_64"
            PBS_SHA256="65b195c9cedc1fef6767f044f9822069adbd1bd9204d424ece4628776fdc04bb"
          fi
          PBS_URL="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_TAG}/cpython-${PBS_VERSION}+${PBS_TAG}-${PBS_ARCH}-apple-darwin-install_only_stripped.tar.gz"
          echo "Downloading: $PBS_URL"
          curl --fail --show-error --location --retry 3 "$PBS_URL" -o python-standalone.tar.gz
          echo "$PBS_SHA256  python-standalone.tar.gz" | shasum -a 256 --check
          tar xzf python-standalone.tar.gz
          rm python-standalone.tar.gz

          # The archive extracts to python/  — rename to engine-venv for
          # consistency with the electron-builder extraResources config
          mv python engine-venv

          # Install the in-repo clipping engine dependencies into standalone Python
          engine-venv/bin/python3 -m pip install --require-hashes -r engine/requirements.lock

          # Verify it works standalone (no framework deps)
          PYTHONPATH=engine engine-venv/bin/python3 -c "import cv2; from clip_engine.bridge_contract import BRIDGE_CONTRACT_VERSION; from clip_engine.services.layout_analyzer import LayoutAnalyzer; assert BRIDGE_CONTRACT_VERSION == 2; assert LayoutAnalyzer().available"
          PYTHONPATH=engine engine-venv/bin/python3 -m unittest discover -s bridge -p 'test_*.py'
          file engine-venv/bin/python3 | grep -q '${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}'

          # Reduce bundle size
          find engine-venv -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find engine-venv -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find engine-venv -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find engine-venv -name "*.pyc" -delete 2>/dev/null || true
          find engine-venv -name "*.pyo" -delete 2>/dev/null || true

          # Replace symlinks with copies (macOS code signing rejects symlinks)
          find engine-venv -type l | while read link; do
            real=$(readlink -f "$link" 2>/dev/null || echo "")
            if [ -n "$real" ] && [ -e "$real" ]; then
              rm "$link"
              cp -a "$real" "$link" 2>/dev/null || true
            else
              rm "$link"
            fi
          done

          # Ensure writable (Squirrel needs write access for quarantine removal)
          chmod -R u+w engine-venv/
          xattr -cr engine-venv/ 2>/dev/null || true

          bash scripts/stage-python-license.sh engine-venv

          echo "Python bundle ready:"
          engine-venv/bin/python3 --version
          du -sh engine-venv/

      - name: Build redistributable FFmpeg and yt-dlp launcher
        run: |
          mkdir -p engine-bin
          bash scripts/build-ffmpeg-mac.sh engine-bin

          # The hash-locked Python package supplies yt-dlp. This launcher
          # avoids bundling a second executable with different license terms.
          cat > engine-bin/yt-dlp <<'SH'
          #!/bin/sh
          BUNDLE_DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          exec "$BUNDLE_DIR/../engine-venv/bin/python3" -m yt_dlp "$@"
          SH

          # Ensure all binaries are executable and writable
          chmod 755 engine-bin/ffmpeg engine-bin/ffprobe engine-bin/yt-dlp
          xattr -cr engine-bin/

          # Verify ffmpeg runs standalone
          engine-bin/ffmpeg -version | head -1
          engine-bin/ffmpeg -hide_banner -filters | grep -E '[[:space:]]ass[[:space:]]' >/dev/null
          file engine-bin/ffmpeg | grep -q '${{ matrix.arch == 'arm64' && 'arm64' || 'x86_64' }}'
          PYTHONPATH=engine engine-venv/bin/python3 bridge/smoke_smart_render.py engine-bin/ffmpeg
          PYTHONPATH=engine engine-venv/bin/python3 bridge/smoke_transcription_audio.py engine-bin
          # Run tests against the exact staged interpreter and dependencies.
          # Keep pytest outside engine-venv so it does not ship in the app.
          pytest_target="$(mktemp -d)"
          trap 'rm -rf "$pytest_target"' EXIT
          engine-venv/bin/python3 -m pip install --target "$pytest_target" pytest==9.1.1
          PYTHONPATH="$PWD/engine:$pytest_target" TEST_FFMPEG=engine-bin/ffmpeg TEST_FFMPEG_DIR=engine-bin PATH="$PWD/engine-bin:$PATH" engine-venv/bin/python3 -m pytest -q engine/tests

          ls -lah engine-bin/

      - name: Build and package (macOS)
        env:
          CSC_KEYCHAIN: build.keychain
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npx electron-vite build
          npx electron-builder --mac --${{ matrix.electron_arch }} --publish never

      - name: Verify signed and notarized app before upload
        run: |
          app_dir="mac"
          if [[ "${{ matrix.arch }}" = "arm64" ]]; then app_dir="mac-arm64"; fi
          app_path="dist/$app_dir/BridgeClip.app"
          [[ -d "$app_path" ]] || { echo "Packaged app missing" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app_path"
          team_id="$(codesign -dv --verbose=4 "$app_path" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          [[ "$team_id" = "9CBJCDR3J2" ]] || { echo "Unexpected signing Team ID" >&2; exit 1; }
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose "$app_path"
          bash scripts/verify-packaged-mac.sh "$app_path" "${{ matrix.arch }}"

      - name: Record release dependency inventory and checksums
        run: |
          npm sbom --sbom-format cyclonedx > dist/node-sbom-${{ matrix.arch }}.json
          engine-venv/bin/python3 -m pip list --format=json > dist/python-packages-${{ matrix.arch }}.json
          (cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS-${{ matrix.arch }}.txt)

      - name: Upload architecture artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
            dist/node-sbom-*.json
            dist/python-packages-*.json
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

  publish:
    needs: [resolve-release, build-macos]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
          persist-credentials: false
      - name: Recheck the explicit tag before publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.resolve-release.outputs.tag }}
          path: release-tag-check
          persist-credentials: false
      - name: Verify release tag still identifies the reviewed commit
        env:
          RELEASE_SHA: ${{ needs.resolve-release.outputs.sha }}
        run: |
          [[ "$(git -C release-tag-check rev-parse HEAD)" = "$RELEASE_SHA" ]] || exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mac-*
          path: release-artifacts
      - name: Merge updater metadata for both architectures
        run: node scripts/merge-update-metadata.cjs release-artifacts
      - name: Publish complete draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          name: BridgeClip ${{ needs.resolve-release.outputs.tag }}
          target_commitish: ${{ needs.resolve-release.outputs.sha }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/mac-*/*.dmg
            release-artifacts/mac-*/*.zip
            release-artifacts/mac-*/*.blockmap
            release-artifacts/latest-mac.yml
            release-artifacts/mac-*/node-sbom-*.json
            release-artifacts/mac-*/python-packages-*.json
            release-artifacts/mac-*/SHA256SUMS-*.txt
