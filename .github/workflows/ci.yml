name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: brew install gitleaks
      - run: gitleaks git --no-banner --redact=100 --log-opts=--all
      - run: gitleaks dir --no-banner --redact=100 .

  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: brew install ffmpeg-full
      - run: echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"
      - run: ffmpeg -hide_banner -filters | grep -E '[[:space:]]ass[[:space:]]'
      - run: node scripts/check-lockfile-integrity.cjs
      - run: npm ci
      - run: python3 -m pip install --require-hashes -r engine/requirements.lock
      - run: python3 -m pip install pytest pip-audit==2.10.1
      - run: PYTHONPATH=engine TEST_FFMPEG="$(command -v ffmpeg)" TEST_FFMPEG_DIR="$(dirname "$(command -v ffmpeg)")" python3 -m pytest -q engine/tests
      - run: python3 -m pip_audit --requirement engine/requirements.lock --disable-pip --require-hashes
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low

  electron-e2e:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install FFmpeg for generated test clips
        run: brew install ffmpeg
      - name: Run isolated Electron posting and account flows
        run: npm run test:e2e

  verify-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: ffmpeg -hide_banner -filters | grep -E '[[:space:]]ass[[:space:]]'
      - run: npm ci
      - run: python3 -m pip install --require-hashes -r engine/requirements.lock
      - run: python3 -m pip install pytest pip-audit==2.10.1
      - run: PYTHONPATH=engine TEST_FFMPEG="$(command -v ffmpeg)" TEST_FFMPEG_DIR="$(dirname "$(command -v ffmpeg)")" python3 -m pytest -q engine/tests
      - run: python3 -m pip_audit --requirement engine/requirements.lock --disable-pip --require-hashes
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low

  verify-windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONPATH: engine
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg for native Windows media tests
        run: choco install ffmpeg --yes --no-progress
      - name: Verify caption support and record media tool paths
        run: |
          $filters = (& ffmpeg -hide_banner -filters 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0 -or $filters -notmatch '\bass\b') {
            throw 'FFmpeg with the libass caption filter is required.'
          }
          $ffmpeg = (Get-Command ffmpeg).Source
          "TEST_FFMPEG=$ffmpeg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEST_FFMPEG_DIR=$(Split-Path $ffmpeg)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: node scripts/check-lockfile-integrity.cjs
      - run: npm ci
      - run: python -m pip install --require-hashes -r engine/requirements.lock
      - run: python -m pip install pytest pip-audit==2.10.1
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:main
      - run: npm run test:renderer
      - run: npm run test:zernio
      - run: npm run test:bridge
      - name: Check release helpers with Git Bash
        shell: bash
        run: npm run test:release
      - run: python -m pytest -q engine/tests
      - run: python -m pip_audit --requirement engine/requirements.lock --disable-pip --require-hashes
      - run: npm run build
      - run: npm audit --audit-level=low

  electron-e2e-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install FFmpeg for generated test clips
        run: sudo apt-get update && sudo apt-get install -y ffmpeg gnome-keyring libsecret-tools dbus-user-session
      - name: Run isolated Electron posting and account flows
        env:
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          dbus-run-session -- sh -ec '
            printf %s bridgeclip-e2e | gnome-keyring-daemon --unlock
            printf %s bridgeclip-e2e-probe | timeout 15s secret-tool store --label=bridgeclip-e2e-ci bridgeclip ci
            test "$(timeout 15s secret-tool lookup bridgeclip ci)" = bridgeclip-e2e-probe
            xvfb-run -a npm run test:e2e
          '
