appId: com.bridgemind.bridgeclip
productName: BridgeClip
copyright: Copyright © 2026 BridgeMind LLC

# Disable production debug/code-injection entry points and validate app.asar.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - "!out/**/*.map"
  - package.json

# The Python bridge runner is invoked by the main process via child_process.spawn.
# It must live OUTSIDE app.asar so the filesystem path is directly readable by
# the Python interpreter. pipeline-runner.ts#getBridgeRunnerPath() looks it up
# via process.resourcesPath when app.isPackaged is true.
extraResources:
  - from: out/renderer/THIRD_PARTY_LICENSES.txt
    to: RENDERER-THIRD-PARTY-LICENSES.txt
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: src/renderer/assets/fonts/Geist-OFL.txt
    to: Geist-OFL.txt
  - from: bridge
    to: bridge
    filter:
      - "**/*.py"
      - "**/*.txt"
      - "!**/test_*.py"
  - from: engine
    to: engine
    filter:
      - "clip_engine/**/*"
      - "assets/**/*"
      - "requirements.txt"
      - "requirements.lock"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "!**/__pycache__"
      - "!**/*.pyc"
  - from: engine-venv
    to: engine-venv
    filter:
      - "**/*"
  - from: engine-bin
    to: engine-bin
    filter:
      - "**/*"

extraMetadata:
  main: ./out/main/index.js

mac:
  category: public.app-category.video
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: "BRIDGEMIND LLC (9CBJCDR3J2)"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  # Credentials and APPLE_TEAM_ID are supplied by the protected release job.
  notarize: true

dmg:
  sign: false
  contents:
    - x: 180
      y: 240
      type: file
    - x: 480
      y: 240
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

# Auto-updates come from GitHub Releases: electron-updater reads
# latest-mac.yml / latest.yml from the newest published (non-draft) release.
publish:
  provider: github
  owner: bridge-mind
  repo: bridgeclip
