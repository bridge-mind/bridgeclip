appId: com.bridgemind.bridgeclip
productName: BridgeClip
artifactName: BridgeClip-${version}-${os}-${arch}.${ext}
copyright: Copyright © 2026 BridgeMind LLC

# Disable production debug/code-injection entry points and validate app.asar.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - "!out/**/*.map"
  - package.json

# The Python bridge runner is invoked by the main process via child_process.spawn.
# It must live OUTSIDE app.asar so the filesystem path is directly readable by
# the Python interpreter. pipeline-runner.ts#getBridgeRunnerPath() looks it up
# via process.resourcesPath when app.isPackaged is true.
extraResources:
  - from: out/renderer/THIRD_PARTY_LICENSES.txt
    to: RENDERER-THIRD-PARTY-LICENSES.txt
  - from: LICENSE
    to: LICENSE
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: src/renderer/assets/fonts/Geist-OFL.txt
    to: Geist-OFL.txt
  - from: bridge
    to: bridge
    filter:
      - "**/*.py"
      - "**/*.txt"
      - "!**/test_*.py"
  - from: engine
    to: engine
    filter:
      - "clip_engine/**/*"
      - "assets/**/*"
      - "requirements.txt"
      - "requirements.lock"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
      - "!**/__pycache__"
      - "!**/*.pyc"
  - from: engine-venv
    to: engine-venv
    filter:
      - "**/*"
  - from: engine-bin
    to: engine-bin
    filter:
      - "**/*"

extraMetadata:
  main: ./out/main/index.js

mac:
  category: public.app-category.video
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: "BRIDGEMIND LLC (9CBJCDR3J2)"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Each native CI job stages one architecture's Python and media binaries.
  # Let the CLI architecture select these targets; an explicit arch list here
  # would override it and package incompatible resources into the other app.
  target:
    - dmg
    - zip
  # Credentials and APPLE_TEAM_ID are supplied by the protected release job.
  notarize: true

dmg:
  sign: false
  contents:
    - x: 180
      y: 240
      type: file
    - x: 480
      y: 240
      type: link
      path: /Applications

win:
  verifyUpdateCodeSignature: true
  signtoolOptions:
    publisherName: BRIDGEMIND LLC
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico

linux:
  # Builder otherwise expands x64 as x86_64 for AppImage and RPM and amd64 for
  # DEB. Linux currently supports x64 only; keep one stable release naming contract.
  artifactName: BridgeClip-${version}-linux-x64.${ext}
  executableName: bridgeclip
  category: AudioVideo
  # hicolor sizes; desktops find no theme directory for a single 1024px icon.
  icon: build/icons
  # Wayland app_id and X11 WM_CLASS match bridgeclip.desktop, so docks group
  # the window with its launcher.
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  maintainer: BridgeMind LLC <support@bridgemind.ai>

# The static AppImage runtime needs no libfuse2, which current Ubuntu, Debian
# and Fedora installs lack. Its desktop entry also keeps the Chromium sandbox.
toolsets:
  appimage: "1.0.3"

deb:
  depends:
    - libgtk-3-0
    - libnss3
    # Name the real ALSA library first. Otherwise apt can satisfy libasound2
    # with liboss4-salsa-asound2 on Ubuntu 24.04, which Electron cannot load.
    - libasound2t64 | libasound2
    - libgbm1
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0

rpm:
  # Shared-library capabilities resolve on Fedora, RHEL and openSUSE alike,
  # where the package names for the same libraries differ.
  depends:
    - libgtk-3.so.0()(64bit)
    - libglib-2.0.so.0()(64bit)
    - libgobject-2.0.so.0()(64bit)
    - libgio-2.0.so.0()(64bit)
    - libpango-1.0.so.0()(64bit)
    - libcairo.so.2()(64bit)
    - libatk-1.0.so.0()(64bit)
    - libatk-bridge-2.0.so.0()(64bit)
    - libatspi.so.0()(64bit)
    - libnss3.so()(64bit)
    - libnssutil3.so()(64bit)
    - libsmime3.so()(64bit)
    - libnspr4.so()(64bit)
    - libcups.so.2()(64bit)
    - libdbus-1.so.3()(64bit)
    - libexpat.so.1()(64bit)
    - libudev.so.1()(64bit)
    - libasound.so.2()(64bit)
    - libgbm.so.1()(64bit)
    - libxkbcommon.so.0()(64bit)
    - libX11.so.6()(64bit)
    - libxcb.so.1()(64bit)
    - libXcomposite.so.1()(64bit)
    - libXdamage.so.1()(64bit)
    - libXext.so.6()(64bit)
    - libXfixes.so.3()(64bit)
    - libXrandr.so.2()(64bit)
    - libsecret-1.so.0()(64bit)
    - xdg-utils
    # Chromium aborts without any font; minimal openSUSE installs have none.
    # The same package name exists on Fedora and openSUSE.
    - liberation-fonts

# Auto-updates come from GitHub Releases: electron-updater reads
# latest-mac.yml / latest.yml / latest-linux.yml from the published release.
publish:
  provider: github
  owner: bridge-mind
  repo: bridgeclip
