<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BridgeClip app icon</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 48px; background: #09090b; color: #fafafa; font: 15px system-ui, sans-serif; }
      main { max-width: 960px; margin: auto; }
      h1 { font-size: 24px; font-weight: 600; }
      p { color: #a1a1aa; }
      .hero { display: block; width: min(360px, 100%); height: auto; margin: 24px auto; }
      .sizes { display: flex; align-items: end; gap: 24px; flex-wrap: wrap; padding: 24px; border-radius: 20px; }
      .light { background: #f4f4f5; color: #18181b; margin-top: 24px; }
      figure { margin: 0; text-align: center; }
      figcaption { font-size: 12px; margin-top: 12px; opacity: .65; }
      img { display: block; }
    </style>
  </head>
  <body>
    <main>
      <h1>BridgeClip app icon</h1>
      <p>A clip/play emblem in BridgeMind gold and cyan. Imagegen master, with transparent outer padding.</p>
      <img class="hero" src="../../resources/bridgeclip-icon.png" alt="BridgeClip app icon" />
      <div class="sizes" aria-label="Icon sizes on a dark surface"></div>
      <div class="sizes light" aria-label="Icon sizes on a light surface"></div>
    </main>
    <script>
      for (const row of document.querySelectorAll('.sizes')) {
        for (const size of [16, 24, 32, 48, 64, 128]) {
          const figure = document.createElement('figure')
          const img = document.createElement('img')
          img.src = size <= 64 ? '../../resources/bridgeclip-icon-small.svg' : '../../resources/bridgeclip-icon.svg'
          img.width = img.height = size
          img.alt = `BridgeClip at ${size} pixels`
          const caption = document.createElement('figcaption')
          caption.textContent = `${size}px`
          figure.append(img, caption)
          row.append(figure)
        }
      }
    </script>
  </body>
</html>
